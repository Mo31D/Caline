<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Selection | Caline Chocolate</title>
  <meta name="description" content="Build a Caline chocolate enquiry list without online payment.">
  <link rel="canonical" href="https://calinefactory.com/selection.html">
  <meta name="theme-color" content="#251815">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body
  data-title-en="My Selection | Caline Chocolate"
  data-title-ar="اختياراتي | كالين للشوكولاتة"
  data-description-en="Build a Caline chocolate enquiry list without online payment."
  data-description-ar="كوّن قائمة استفسار عن شوكولاتة كالين بدون دفع عبر الموقع.">
<div data-site-header></div>
<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <div>
        <p class="eyebrow" data-en="Local enquiry list" data-ar="قائمة استفسار محلية">Local enquiry list</p>
        <h1 data-selection-title>My selection</h1>
        <p class="lead"
           data-en="This is a shortlist, not a checkout. Your selection stays only in this browser until you choose to email or copy it."
           data-ar="هذه قائمة مختصرة وليست سلة دفع. تبقى اختياراتك في هذا المتصفح فقط حتى تختار إرسالها بالبريد أو نسخها.">
           This is a shortlist, not a checkout.
        </p>
      </div>
      <div class="page-mark"><img src="images/logo.png" alt="Caline"></div>
    </div>
  </section>

  <section class="section selection-page">
    <div class="wrap">
      <div class="selection-list" data-selection-list></div>
      <div class="selection-actions">
        <a class="button" data-email-selection href="mailto:info@calinefactory.com" data-en="Email this enquiry" data-ar="أرسل الاستفسار بالبريد">Email this enquiry</a>
        <button class="button secondary" data-copy-selection type="button" data-en="Copy enquiry" data-ar="انسخ الاستفسار">Copy enquiry</button>
        <button class="button secondary" data-clear-selection type="button" data-en="Clear selection" data-ar="امسح الاختيارات">Clear selection</button>
      </div>

      <div class="email-preview">
        <p class="eyebrow" data-en="Message preview" data-ar="معاينة الرسالة">Message preview</p>
        <pre data-email-preview></pre>
      </div>

      <div class="notice" style="margin-top:28px"
           data-en="<strong>No payment is taken here.</strong> The site helps you describe what you want; Caline can then confirm the current range, price, quantity and availability."
           data-ar="<strong>لا يتم تحصيل أي دفع هنا.</strong> يساعدك الموقع على وصف ما تريد، ثم يمكن لكالين تأكيد التشكيلة والسعر والكمية والتوفر الحالي.">
        <strong>No payment is taken here.</strong>
      </div>
    </div>
  </section>
</main>
<div data-site-footer></div>
<script src="assets/site.js"></script>
</body>
</html>
