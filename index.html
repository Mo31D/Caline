<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caline Chocolate</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://calinefactory.com/en/">
<link rel="alternate" hreflang="en" href="https://calinefactory.com/en/">
<link rel="alternate" hreflang="ar" href="https://calinefactory.com/ar/">
<link rel="alternate" hreflang="x-default" href="https://calinefactory.com/en/">
<meta name="theme-color" content="#120a09">
<style>html,body{height:100%;margin:0;background:#120a09;color:#f1e9e5;font-family:Arial,sans-serif}body{display:grid;place-items:center;text-align:center}.gate{padding:32px}.gate img{width:190px;max-height:90px;object-fit:cover}.gate p{color:#bdaaa3}.gate a{color:#e1c789;margin:0 10px}</style>
<script>
(function(){
  var saved=localStorage.getItem('caline-language');
  var lang=saved==='ar'||saved==='en'?saved:((navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en');
  location.replace(lang==='ar'?'ar/':'en/');
})();
</script>
</head>
<body><div class="gate"><img src="images/logo.png" alt="Caline"><p>Choose your language · اختر اللغة</p><a href="en/" hreflang="en">English</a><a href="ar/" hreflang="ar">العربية</a></div></body>
</html>
