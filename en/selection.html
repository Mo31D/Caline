<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex,follow">
  <title>My List | Caline Chocolate</title>
  <meta name="description" content="Save your favourite Caline collections in one list and send a simple enquiry when you are ready.">
  <link rel="canonical" href="https://calinefactory.com/en/selection.html">
  <link rel="alternate" hreflang="en" href="https://calinefactory.com/en/selection.html">
  <link rel="alternate" hreflang="ar" href="https://calinefactory.com/ar/selection.html">
  <link rel="alternate" hreflang="x-default" href="https://calinefactory.com/en/selection.html">

<body
 
 
 
 >
<div data-site-header></div>
<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <div>
        <p class="eyebrow">Saved for later</p>
        <h1 data-selection-title>Your Caline list.</h1>
        <p class="lead"
          
          >Keep the collections you like in one place, then send us one message when you’re ready.</p>
      </div>
      <div class="page-mark"><img src="../images/logo-display.svg" alt="Caline"></div>
    </div>
  </section>

  <section class="section selection-page">
    <div class="wrap">
      <div class="selection-list" data-selection-list></div>
      <div class="selection-actions">
        <a class="button" data-email-selection href="mailto:info@calinefactory.com">Email my list</a>
        <button class="button secondary" data-copy-selection type="button">Copy my list</button>
        <button class="button secondary" data-clear-selection type="button">Clear list</button>
      </div>

      <div class="email-preview">
        <p class="eyebrow">Your message</p>
        <pre data-email-preview></pre>
      </div>

      <div class="notice" style="margin-top:28px"
          
          ><strong>When you’re ready.</strong> We’ll confirm current options, prices and availability with you directly.</div>
    </div>
  </section>
</main>
<div data-site-footer></div>
<script src="../assets/site.js?v=20260923-21"></script>
